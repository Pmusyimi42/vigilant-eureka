<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilant Eureka</title>
</head>
<body>
    <h1> Vigilant Eureka</h1>
    <div class="main"></div>
    <script>
         const housing = document.querySelector('.main') 
        for(let i = 0; ; i++){

            const para = document.createElement('p')
            const answer = Number(prompt('Enter number above 100: '))
            if( answer <= 100 && answer) {
                para.textContent = answer
                housing.appendChild(para)
                break
            }

        }


    </script>
</body>
</html>
